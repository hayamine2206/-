<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>俺のアニメ絶対評価レビュー</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: "Helvetica Neue", Arial, sans-serif; background: #0f0f12; color: #fff; margin: 0; padding: 20px; }
    header { text-align: center; padding: 40px 0; border-bottom: 1px solid #333; }
    h1 { font-size: 2rem; color: #ff0055; margin-bottom: 10px; }
    .pr-notice { text-align: center; font-size: 0.8rem; color: #888; margin-top: 5px; }
    .container { max-width: 800px; margin: 30px auto; }
    
    /* アニメ評価カード */
    .anime-card { background: #1a1a24; border-radius: 12px; padding: 25px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid #2a2a38; }
    .anime-title { font-size: 1.5rem; margin: 0 0 10px 0; color: #fff; }
    .rating { color: #ffcc00; font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; }
    .review-text { line-height: 1.7; color: #ccc; margin-bottom: 20px; white-space: pre-wrap; }
    
    /* U-NEXT誘導ボタン */
    .unext-btn {
      display: block;
      width: 100%;
      text-align: center;
      background: linear-gradient(45deg, #0084ff, #00d2ff);
      color: #fff;
      font-size: 1.1rem;
      font-weight: bold;
      padding: 15px 0;
      border-radius: 8px;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(0, 132, 255, 0.3);
      transition: transform 0.2s, opacity 0.2s;
    }
    .unext-btn:hover { transform: translateY(-2px); opacity: 0.9; }
  </style>
</head>
<body>

  <header>
    <h1>俺のアニメ絶対評価ライブラリ</h1>
    <p>俺の独断と偏見で評価！面白い作品だけを厳選紹介</p>
    <!-- ステマ規制対策（アフィリエイトリンクを貼る場合に必須） -->
    <div class="pr-notice">※本ページはプロモーションが含まれています</div>
  </header>

  <div class="container">

    <!-- 作品1 -->
    <div class="anime-card">
      <h2 class="anime-title">作品名：チェンソーマン</h2>
      <div class="rating">俺の評価： ★★★★★ (5.0 / 5.0)</div>
      <p class="review-text">【感想】作画と演出が映画レベル。ストーリー展開もテンポが良くて一気に観られる。神作。</p>
      <!-- ここに自分のU-NEXTアフィリエイトURLを入れる -->
      <a href="ここにU-NEXTのアフィリエイトリンク" target="_blank" rel="noopener noreferrer" class="unext-btn">
        ▶ U-NEXTで「チェンソーマン」を31日間無料で観る
      </a>
    </div>

    <!-- 作品2 -->
    <div class="anime-card">
      <h2 class="anime-title">作品名：〇〇〇〇</h2>
      <div class="rating">俺の評価： ★★★★☆ (4.0 / 5.0)</div>
      <p class="review-text">【感想】〇〇のシーンが熱い。後半の怒涛の伏線回収が見どころ。</p>
      <a href="ここにU-NEXTのアフィリエイトリンク" target="_blank" rel="noopener noreferrer" class="unext-btn">
        ▶ U-NEXTで観てみる（31日間無料体験）
      </a>
    </div>

  </div>

</body>
</html>
